<svg xmlns="http://www.w3.org/2000/svg" width="900" height="50" viewBox="0 0 900 50" fill="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1E90FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#1E90FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E90FF" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes pop   { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
      .bar  { transform-origin: 450px 25px; animation: grow 1.1s ease forwards; }
      .gem  { transform-origin: 450px 25px; opacity: 0; animation: pop .5s ease .9s forwards; }
    </style>
  </defs>

  <!-- gradient hairline -->
  <rect class="bar" x="120" y="24.2" width="660" height="1.6" rx="1" fill="url(#fade)"/>

  <!-- center geometric accent -->
  <g class="gem">
    <rect x="442" y="17" width="16" height="16" rx="2" transform="rotate(45 450 25)" fill="none" stroke="#1E90FF" stroke-width="1.8"/>
    <circle cx="450" cy="25" r="2.4" fill="#1E90FF"/>
  </g>
</svg>
