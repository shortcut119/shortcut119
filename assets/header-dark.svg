<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" fill="none" role="img" aria-label="Full Stack + AI Engineer">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1d2733"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw   { to { stroke-dashoffset: 0; } }
      @keyframes blink  { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
      .fade  { opacity: 0; animation: fadeUp .9s ease forwards; }
      .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; }
      .mark { stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw 1.6s ease .2s forwards; }
      .line { stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw 1.2s ease .5s forwards; }
      .spark { animation: blink 2.6s ease-in-out infinite; }
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="258" rx="14" fill="#0d1117" stroke="#222a35" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="256" rx="13" fill="url(#dots)"/>
  <rect x="2" y="2" width="896" height="256" rx="13" fill="url(#vignette)"/>

  <path class="line" d="M28 30 L28 58 M28 30 L56 30" stroke="#1E90FF" stroke-width="2" stroke-linecap="round"/>
  <path class="line" d="M872 230 L872 202 M872 230 L844 230" stroke="#1E90FF" stroke-width="2" stroke-linecap="round"/>

  <circle class="spark" cx="120" cy="70"  r="2.5" fill="#1E90FF"/>
  <circle class="spark" cx="780" cy="190" r="2.5" fill="#1E90FF" style="animation-delay:1.1s"/>
  <circle class="spark" cx="700" cy="60"  r="2"   fill="#3f7fd1" style="animation-delay:1.7s"/>

  <path class="mark" d="M450 46 L476 72 L450 98 L424 72 Z" stroke="#58a6ff" stroke-width="2" stroke-linejoin="round"/>
  <circle class="fade d2" cx="450" cy="72" r="2.8" fill="#58a6ff"/>

  <text class="fade d2" x="450" y="150" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="1" fill="#f0f6fc">Full Stack + AI Engineer</text>
  <text class="fade d3" x="450" y="184" text-anchor="middle" font-size="13" font-weight="500" letter-spacing="6" fill="#8b949e">FULL STACK · AI · BLOCKCHAIN</text>
</svg>
