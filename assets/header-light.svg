<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" fill="none" role="img" aria-label="Full Stack + AI Engineer">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#eef1f5" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw   { to { stroke-dashoffset: 0; } }
      @keyframes blink  { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
      .fade  { opacity: 0; animation: fadeUp .9s ease forwards; }
      .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; }
      .mark { stroke-dasharray: 180; stroke-dashoffset: 180; animation: draw 1.6s ease .2s forwards; }
      .line { stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw 1.2s ease .5s forwards; }
      .spark { animation: blink 2.6s ease-in-out infinite; }
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="258" rx="14" fill="#ffffff" stroke="#eaedf2" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="256" rx="13" fill="url(#grid)"/>
  <rect x="2" y="2" width="896" height="256" rx="13" fill="url(#vignette)"/>

  <path class="line" d="M28 30 L28 58 M28 30 L56 30" stroke="#1E90FF" stroke-width="2" stroke-linecap="round"/>
  <path class="line" d="M872 230 L872 202 M872 230 L844 230" stroke="#1E90FF" stroke-width="2" stroke-linecap="round"/>

  <circle class="spark" cx="120" cy="70"  r="2.5" fill="#1E90FF"/>
  <circle class="spark" cx="780" cy="190" r="2.5" fill="#2da44e" style="animation-delay:1.1s"/>
  <circle class="spark" cx="700" cy="60"  r="2"   fill="#8957e5" style="animation-delay:1.7s"/>
  <circle class="spark" cx="180" cy="200" r="2"   fill="#e85aad" style="animation-delay:2.1s"/>
  <circle class="spark" cx="820" cy="90"  r="2.2" fill="#e0a800" style="animation-delay:.6s"/>
  <circle class="spark" cx="90"  cy="150" r="2"   fill="#1eb8c4" style="animation-delay:1.4s"/>

  <rect class="mark" x="428" y="50" width="44" height="44" rx="7" transform="rotate(45 450 72)" stroke="#1E90FF" stroke-width="2.8" stroke-linejoin="round"/>
  <circle class="fade d2" cx="450" cy="72" r="6.5" fill="#1E90FF"/>

  <text class="fade d2" x="450" y="150" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="1" fill="#1E90FF">Full Stack + AI Engineer</text>
  <text class="fade d3" x="450" y="184" text-anchor="middle" font-size="13" font-weight="500" letter-spacing="6" fill="#8a93a3">FULL STACK · AI · BLOCKCHAIN</text>
</svg>
